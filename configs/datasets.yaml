# ============================================================
# DATASETS CONFIGURATION
# Doktorat_Kod
# ============================================================

datasets:

  # ----------------------------------------------------------
  # General paths
  # ----------------------------------------------------------

  paths:

    raw:
      root: "data/raw"

      images: "data/raw/images"
      wsi: "data/raw/wsi"
      rna: "data/raw/rna"
      hand: "data/raw/hand"

    processed:
      root: "data/processed"

      images: "data/processed/images"
      cells: "data/processed/cells"
      rna: "data/processed/rna"
      embeddings: "data/processed/embeddings"

    longitudinal:
      root: "data/longitudinal"

      T0: "data/longitudinal/T0"
      T1: "data/longitudinal/T1"
      T2: "data/longitudinal/T2"
      T3: "data/longitudinal/T3"

  # ----------------------------------------------------------
  # Own cohort
  # ----------------------------------------------------------

  own_cohort:

    enabled: true

    root: "data/raw"

    images:
      path: "data/raw/images"
      recursive: true

      extensions:
        - ".jpg"
        - ".jpeg"
        - ".png"
        - ".tif"
        - ".tiff"
        - ".bmp"

    wsi:
      path: "data/raw/wsi"
      recursive: true

      extensions:
        - ".svs"
        - ".ndpi"
        - ".mrxs"
        - ".tif"
        - ".tiff"

    rna:
      path: "data/raw/rna"
      recursive: true

      extensions:
        - ".h5ad"
        - ".csv"
        - ".tsv"
        - ".mtx"

    hand:
      path: "data/raw/hand"

      recursive: true

      extensions:
        - ".jpg"
        - ".jpeg"
        - ".png"

  # ----------------------------------------------------------
  # Human Cell Atlas
  # ----------------------------------------------------------

  human_cell_atlas:

    enabled: true

    name: "Human Cell Atlas"

    local_path: "data/raw/rna/human_cell_atlas"

    modality: "single_cell_rna"

    file_format: "h5ad"

    download: false

    preprocessing:

      normalize: true

      log1p: true

      highly_variable_genes: true

      n_top_genes: 2000

      pca_components: 50

  # ----------------------------------------------------------
  # Human Skin Atlas
  # ----------------------------------------------------------

  human_skin_atlas:

    enabled: true

    name: "Human Skin Atlas"

    local_path: "data/raw/rna/human_skin_atlas"

    modality: "single_cell_rna"

    file_format: "h5ad"

    download: false

    preprocessing:

      normalize: true

      log1p: true

      highly_variable_genes: true

      n_top_genes: 2000

      pca_components: 50

  # ----------------------------------------------------------
  # GEO
  # ----------------------------------------------------------

  geo:

    enabled: true

    cache_dir: "data/raw/rna/geo"

    download: false

    organisms:

      - "Homo sapiens"

    preferred_formats:

      - "h5ad"
      - "csv"
      - "tsv"

  # ----------------------------------------------------------
  # TCGA
  # ----------------------------------------------------------

  tcga:

    enabled: true

    root: "data/raw/rna/tcga"

    download: false

    cancer_types:

      - "SKCM"

    modalities:

      expression: true
      clinical: true
      mutation: false

  # ----------------------------------------------------------
  # Hand datasets
  # ----------------------------------------------------------

  hand_datasets:

    interhand2_6m:

      enabled: true

      root: "data/raw/hand/InterHand2_6M"

      images: "data/raw/hand/InterHand2_6M/images"

      annotations: "data/raw/hand/InterHand2_6M/annotations"

      use_for_training: true

    media:

      enabled: true

      root: "data/raw/hand/media"

      use_for_training: false

    own_cohort:

      enabled: true

      root: "data/raw/hand/own_cohort"

      use_for_training: true

  # ----------------------------------------------------------
  # Dataset split
  # ----------------------------------------------------------

  split:

    train: 0.70

    validation: 0.15

    test: 0.15

    random_seed: 42

    stratify: true

    patient_level: true

  # ----------------------------------------------------------
  # Longitudinal data
  # ----------------------------------------------------------

  longitudinal:

    enabled: true

    timepoints:

      - "T0"
      - "T1"
      - "T2"
      - "T3"

    require_all_timepoints: false

    patient_level_alignment: true

    missing_value_strategy: "mask"

  # ----------------------------------------------------------
  # Data quality
  # ----------------------------------------------------------

  quality_control:

    check_duplicates: true

    check_missing_values: true

    check_corrupted_files: true

    check_image_dimensions: true

    check_patient_ids: true

    check_longitudinal_consistency: true

  # ----------------------------------------------------------
  # Privacy
  # ----------------------------------------------------------

  privacy:

    remove_metadata: true

    anonymize_patient_ids: true

    store_original_identifiers: false

    export_phi: false
