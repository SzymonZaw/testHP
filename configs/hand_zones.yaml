# Hand anatomical zone ontology v2
# Spatial structure only. It never implies a diagnosis or biological conclusion.

hand:
  - id: palm
    name: Palm
    level: anatomical_region
    children: [thenar, hypothenar, central_palm, creases]

  - id: thumb
    name: Thumb
    level: anatomical_region
    children: [proximal, middle, distal, nail]

  - id: index
    name: Index
    level: anatomical_region
    children: [proximal, middle, distal, nail]

  - id: middle
    name: Middle
    level: anatomical_region
    children: [proximal, middle, distal, nail]

  - id: ring
    name: Ring
    level: anatomical_region
    children: [proximal, middle, distal, nail]

  - id: little
    name: Little
    level: anatomical_region
    children: [proximal, middle, distal, nail]

  - id: wrist
    name: Wrist
    level: anatomical_region
    children: [dorsal, ventral]

  - id: nails
    name: Nails
    level: anatomical_region
    children: [thumb_nail, index_nail, middle_nail, ring_nail, little_nail]

  - id: skin_regions
    name: Skin regions
    level: observation_region
    children: [dorsal, palmar, pigmentation, texture, vascular, lesions, aging, inflammation]

observation_policy:
  evidence_level: observed
  allow_diagnosis: false
  allow_biological_interpretation: false
  purpose: "Stable spatial attachment for longitudinal hand observations."
