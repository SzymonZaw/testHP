name: CI

on:
  push:
    branches: ["dev/next-cleanup"]
  pull_request:
    branches: ["dev/next-cleanup"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          installed=0
          for file in requirements.txt backend/requirements.txt backend/requirements-dev.txt; do
            if [ -f "$file" ]; then
              echo "Installing $file"
              pip install -r "$file"
              installed=1
            fi
          done
          if [ "$installed" -eq 0 ]; then
            echo "No requirements file found; installing the CI test runner only."
          fi
          pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q backend

      - name: Run backend tests
        shell: bash
        run: |
          if [ -d backend/tests ]; then
            pytest -q backend/tests
          elif [ -d tests ]; then
            pytest -q tests
          else
            echo "No test directory found; compile check is the available backend smoke test."
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            frontend/digital-twin/package-lock.json

      - name: Detect frontend package
        id: frontend
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f frontend/package.json ]; then
            echo "dir=frontend" >> "$GITHUB_OUTPUT"
          elif [ -f frontend/digital-twin/package.json ]; then
            echo "dir=frontend/digital-twin" >> "$GITHUB_OUTPUT"
          else
            echo "dir=" >> "$GITHUB_OUTPUT"
            echo "No package.json found; frontend build is not configured yet."
          fi

      - name: Install frontend dependencies
        if: steps.frontend.outputs.dir != ''
        working-directory: ${{ steps.frontend.outputs.dir }}
        run: npm ci

      - name: Lint
        if: steps.frontend.outputs.dir != ''
        working-directory: ${{ steps.frontend.outputs.dir }}
        run: npm run lint --if-present

      - name: Typecheck
        if: steps.frontend.outputs.dir != ''
        working-directory: ${{ steps.frontend.outputs.dir }}
        run: npm run typecheck --if-present

      - name: Test
        if: steps.frontend.outputs.dir != ''
        working-directory: ${{ steps.frontend.outputs.dir }}
        run: npm test --if-present -- --runInBand

      - name: Build
        if: steps.frontend.outputs.dir != ''
        working-directory: ${{ steps.frontend.outputs.dir }}
        run: npm run build --if-present

  architecture:
    name: Architecture smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify target architecture documentation
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/architecture/target-structure.md
          test -f docs/architecture/reference-and-intervention.md

      - name: Verify critical backend domains
        shell: bash
        run: |
          set -euo pipefail
          for dir in api domain pipelines models evidence provenance qc longitudinal reference intervention model_registry database; do
            if [ ! -d "backend/$dir" ] && [ ! -d "$dir" ]; then
              echo "Missing expected architecture directory: $dir"
              exit 1
            fi
          done

      - name: Verify workflow isolation
        shell: bash
        run: |
          set -euo pipefail
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$workflow" ] || continue
            if grep -Eq 'branches:.*main|branches:.*master' "$workflow"; then
              echo "Workflow explicitly targets main/master: $workflow"
              # Do not fail existing workflows automatically; print the finding for review.
              grep -n -E 'branches:.*main|branches:.*master' "$workflow" || true
            fi
          done
          echo "CI runs against dev/next-cleanup; no workflow in this job modifies main."
