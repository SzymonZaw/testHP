name: apply target drift diagnostic correction

on:
  push:
    branches: [feature/new-branch]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/new-branch
          fetch-depth: 0
      - name: Fix canonical manager target selection
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/digital-twin/evidence-registry-bridge.js')
          s = p.read_text()
          old = '''    const managerTarget = canonicalSpatialId(\n      manager?.spatialTarget ||\n      managerState?.spatialTarget ||\n      active?.spatial_node_id || active?.spatial_id || active?.spatialId ||\n      managerState?.spatial_node_id || managerState?.spatial_id || managerState?.spatialId\n    );'''
          new = '''    // spatialTarget may be a display label (for example "Cell target 2").\n    // Registry matching must use the canonical spatial path/id instead.\n    const managerSpatialTarget = manager?.spatialTarget && typeof manager.spatialTarget === 'object'\n      ? (manager.spatialTarget.spatial_node_id || manager.spatialTarget.spatial_id || manager.spatialTarget.spatialId)\n      : (typeof manager?.spatialTarget === 'string' && manager.spatialTarget.includes('/') ? manager.spatialTarget : null);\n    const managerStateSpatialTarget = managerState?.spatialTarget && typeof managerState.spatialTarget === 'object'\n      ? (managerState.spatialTarget.spatial_node_id || managerState.spatialTarget.spatial_id || managerState.spatialTarget.spatialId)\n      : (typeof managerState?.spatialTarget === 'string' && managerState.spatialTarget.includes('/') ? managerState.spatialTarget : null);\n    const managerTarget = canonicalSpatialId(\n      active?.spatial_node_id || active?.spatial_id || active?.spatialId ||\n      managerState?.spatial_node_id || managerState?.spatial_id || managerState?.spatialId ||\n      managerSpatialTarget || managerStateSpatialTarget\n    );'''
          if old not in s:
              raise SystemExit('expected target-selection block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- frontend/digital-twin/evidence-registry-bridge.js
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/digital-twin/evidence-registry-bridge.js .github/workflows/apply-target-drift-fix.yml
          git commit -m "fix(twin): reject display labels as canonical spatial targets"
          git rm .github/workflows/apply-target-drift-fix.yml
          git commit -m "chore: remove one-shot target drift fixer"
          git push origin HEAD:feature/new-branch
