name: Digital Twin E2E

on:
  push:
    branches:
      - dev/next-cleanup
  pull_request:
    branches:
      - dev/next-cleanup
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run Digital Twin E2E test
        run: python -m pytest -q tests/test_digital_twin_e2e.py
