name: testHP CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install lightweight CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Run integrated pipeline demo
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_demo.py

  api:
    name: FastAPI smoke test
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install lightweight CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Start API
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          nohup uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/testhp-api.log 2>&1 &
          echo $! > /tmp/testhp-api.pid
      - name: Wait for API
        run: |
          python - <<'PY'
          import time
          import urllib.request
          url = 'http://127.0.0.1:8000/api/health'
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          print(open('/tmp/testhp-api.log', errors='replace').read())
          raise SystemExit('FastAPI did not become ready')
          PY
      - name: API health smoke test
        run: |
          python - <<'PY'
          import json
          import urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5) as response:
              payload = json.load(response)
          assert payload == {'status': 'ok'}
          print('FastAPI health check passed')
          PY
      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/testhp-api.pid ]; then kill "$(cat /tmp/testhp-api.pid)" || true; fi

  frontend:
    name: React install and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check whether frontend exists
        id: frontend_check
        shell: bash
        run: |
          if [ -f frontend/package.json ] && [ -f frontend/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        if: steps.frontend_check.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: steps.frontend_check.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: Build React application
        if: steps.frontend_check.outputs.present == 'true'
        working-directory: frontend
        run: npm run build
      - name: Frontend not present yet
        if: steps.frontend_check.outputs.present == 'false'
        run: echo "React frontend is not present in this branch; frontend build skipped."

  integration:
    name: Full project CI gate
    runs-on: ubuntu-latest
    needs: [backend, api, frontend]
    if: ${{ always() }}
    steps:
      - name: Verify required checks
        run: |
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.api.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          echo "Backend, FastAPI and frontend jobs completed successfully."
