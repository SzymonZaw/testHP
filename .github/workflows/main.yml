name: testHP CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Run Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Run integrated pipeline demo
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_demo.py

  api:
    name: FastAPI smoke test
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install httpx

      - name: Start API
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          nohup uvicorn backend.app:app --host 127.0.0.1 --port 8000 > /tmp/testhp-api.log 2>&1 &
          echo $! > /tmp/testhp-api.pid

      - name: Wait for API
        run: |
          python - <<'PY'
          import time
          import urllib.request
          url = 'http://127.0.0.1:8000/docs'
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          print(open('/tmp/testhp-api.log', errors='replace').read())
          raise SystemExit('FastAPI did not become ready')
          PY

      - name: API health smoke test
        run: |
          python - <<'PY'
          import urllib.request
          response = urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)
          assert response.status == 200
          print('FastAPI is responding')
          PY

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/testhp-api.pid ]; then kill "$(cat /tmp/testhp-api.pid)" || true; fi

  frontend:
    name: React install and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React application
        working-directory: frontend
        run: npm run build

  integration:
    name: Full project CI gate
    runs-on: ubuntu-latest
    needs: [backend, api, frontend]
    steps:
      - name: All checks passed
        run: echo "Backend, FastAPI and React checks passed."
