name: apply target source priority fix

on:
  push:
    branches: [feature/new-branch]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/new-branch
          fetch-depth: 0
      - name: Fix canonical target source priority
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/digital-twin/evidence-registry-bridge.js')
          s = p.read_text()
          old = '''    const managerTarget = canonicalSpatialId(\n      active?.spatial_node_id || active?.spatial_id || active?.spatialId ||\n      managerState?.spatial_node_id || managerState?.spatial_id || managerState?.spatialId ||\n      managerSpatialTarget || managerStateSpatialTarget\n    );'''
          new = '''    // The viewport manager exposes `spatialTarget` as a display label in the\n    // current runtime (e.g. "Cell target 2"). The active viewport node and\n    // activeKey contain the canonical registry path. Never let a label win.\n    const activeSpatialTarget = canonicalSpatialId(\n      active?.spatial_node_id || active?.spatial_id || active?.spatialId\n    );\n    const activeKeyTarget = (() => {\n      const match = activeKey.match(/^(?:macro|tissue|cell|cellular)\\|(.+)$/);\n      return match?.[1] ? canonicalSpatialId(match[1]) : null;\n    })();\n    const managerTarget = activeSpatialTarget || activeKeyTarget || managerSpatialTarget || managerStateSpatialTarget;'''
          if old not in s:
              raise SystemExit('expected manager target block not found')
          s = s.replace(old, new, 1)
          old2 = '''    if (managerTarget) return managerTarget;\n    if (contractTarget) return contractTarget;\n    if (explicitViewportTarget) return explicitViewportTarget;\n    if (activeKey) {\n      const match = activeKey.match(/^(?:macro|tissue|cell|cellular)\\|(.+)$/);\n      if (match?.[1]) return canonicalSpatialId(match[1].includes('/') ? match[1] : match[1]);\n    }\n    return legacyTarget || 'hand';'''
          new2 = '''    if (managerTarget) return managerTarget;\n    if (contractTarget) return contractTarget;\n    if (explicitViewportTarget) return explicitViewportTarget;\n    return legacyTarget || 'hand';'''
          if old2 not in s:
              raise SystemExit('expected fallback block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- frontend/digital-twin/evidence-registry-bridge.js
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/digital-twin/evidence-registry-bridge.js .github/workflows/apply-target-source-priority-fix.yml
          git commit -m "fix(twin): prioritize canonical active viewport target"
          git rm .github/workflows/apply-target-source-priority-fix.yml
          git commit -m "chore: remove one-shot target source fixer"
          git push origin HEAD:feature/new-branch
